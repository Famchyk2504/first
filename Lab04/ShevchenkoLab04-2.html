<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Лабораторна робота №4</title>
</head>
<body bgcolor="#1e1e1e" text="#ffffff">

<p align="center">
    <h2>Самостійна робота: Рядки, що біжать</h2>
    <br>

   
    <marquee width="800" bgcolor="#ff4757" height="40" behavior="alternate" scrolldelay="85" scrollamount="4">
        <font color="#ffffff" face="Arial" size="4"><b> ХОДЖУ ТУДИ-СЮДИ </b></font>
    </marquee>
    <br><br>

   
    <marquee width="800" bgcolor="#2ed573" height="40" direction="left" behavior="scroll" scrolldelay="85" scrollamount="5">
        <font color="#2f3542" face="Verdana" size="4"><i> ТІКАЮ ВЛІВО ТА НЕНАДОВГО </i></font>
    </marquee>
    <br><br>

  
    <marquee width="800" bgcolor="#1e90ff" height="40" direction="right" behavior="slide" scrolldelay="85" scrollamount="6">
        <font color="#ffffff" face="Tahoma" size="4"><b> СПРАВА СТІНА, Я НЕ ПІДУ ДАЛІ </b></font>
    </marquee>
    <br><br>


    <marquee width="800" bgcolor="#ffa502" height="40" direction="left" behavior="scroll" scrolldelay="10" scrollamount="10">
        <font color="#2f3542" face="Courier New" size="4"><b> Я СПРИНТ!</b></font>
    </marquee>
    <br><br>

    
    <marquee width="800" bgcolor="#9b59b6" height="40" direction="left" behavior="scroll" scrolldelay="200" scrollamount="5">
        <font color="#ffffff" face="Georgia" size="4"><i> ТУРБО РАВЛИК </i></font>
    </marquee>

</p>

</body>
</html>
